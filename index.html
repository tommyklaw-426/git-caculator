<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">
    <div class="calculator-container">
        <div class="calculator">
            <!-- Display Header -->
            <div class="display-container">
                <button id="theme-toggle" class="theme-btn">☀️/🌙</button>
                <div id="display" class="display">0</div>
            </div>

            <!-- Memory Panel (Bonus) -->
            <div class="memory-row">
                <button class="btn memory-btn" data-action="mc">MC</button>
                <button class="btn memory-btn" data-action="mr">MR</button>
                <button class="btn memory-btn" data-action="m-add">M+</button>
                <button class="btn memory-btn" data-action="m-sub">M-</button>
            </div>

            <!-- Keypad -->
            <div class="keypad">
                <!-- Row 1: Scientific & Clear -->
                <button class="btn scientific" data-action="clear">C</button>
                <button class="btn scientific" data-action="toggle-sign">+/-</button>
                <button class="btn scientific" data-action="percentage">%</button>
                <button class="btn scientific" data-action="sqrt">√</button>

                <!-- Row 2 -->
                <button class="btn operator" data-action="exponent">^</button>
                <button class="btn operator" data-action="operator" data-val="/">÷</button>
                <button class="btn operator" data-action="operator" data-val="*">×</button>
                <button class="btn operator" data-action="operator" data-val="-">-</button>

                <!-- Numbers & Basic Ops -->
                <button class="btn num" data-val="7">7</button>
                <button class="btn num" data-val="8">8</button>
                <button class="btn num" data-val="9">9</button>
                <button class="btn operator" data-action="operator" data-val="+">+</button>

                <button class="btn num" data-val="4">4</button>
                <button class="btn num" data-val="5">5</button>
                <button class="btn num" data-val="6">6</button>
                <button class="btn equals" data-action="calculate" style="grid-row: span 2;">=</button>

                <button class="btn num" data-val="1">1</button>
                <button class="btn num" data-val="2">2</button>
                <button class="btn num" data-val="3">3</button>

                <button class="btn num zero" data-val="0" style="grid-column: span 2;">0</button>
                <button class="btn num" data-val=".">.</button>
            </div>
        </div>

        <!-- Interactive History Log Panel -->
        <aside class="history-panel">
            <div class="history-header">
                <h3>Calculation History</h3>
                <button id="clear-history-btn" class="clear-btn">Clear</button>
            </div>
            <ul id="history-list" class="history-list">
                <li class="empty-msg">No calculations yet</li>
            </ul>
        </aside>
    </div>

    <script src="script.js"></script>
</body>

</html>
